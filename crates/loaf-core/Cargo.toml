[package]
name = "loaf-core"
description = "Loaf business logic. Must never depend on tauri (ADR-002): it has to compile and test anywhere."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1.44"
unicode-normalization = "0.1.25"
uuid = { version = "1.27.0", features = ["v7"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
ts-rs = { version = "11", features = ["chrono-impl", "serde-json-impl"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["sync", "rt", "macros", "time", "test-util"] }

[features]
default = ["ts"]
# Generates src/ipc/generated/*.ts via `cargo test -p loaf-core export_bindings`. No tauri.
ts = ["dep:ts-rs"]
